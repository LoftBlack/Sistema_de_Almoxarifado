<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Conta — Sistema de Almoxarifado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="topbar">
    <div class="marca">
      <span class="logo-mini"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo"></span>
      <span>Sistema de Almoxarifado</span>
    </div>
    <div class="usuario-area">
      <a href="{{ url_for('items.dashboard') }}" class="link-topo">Voltar ao Painel</a>
      <a href="{{ url_for('auth.logout') }}" class="btn-sair" title="Sair">Sair</a>
    </div>
  </div>

  <h1 class="boas-vindas">Minha Conta</h1>

  <div class="container" style="max-width: 480px;">
    <div class="painel" style="padding: 30px;">
      <p style="margin-top: 0; color: var(--texto-suave);">
        <strong style="color: var(--marrom);">Usuário:</strong> {{ usuario.username }}<br>
        <strong style="color: var(--marrom);">Nome:</strong> {{ usuario.nome }}
      </p>

      {% if mensagem %}
      <div class="alerta" style="background: rgba(76,122,76,0.1); color: #4c7a4c; border-color: rgba(76,122,76,0.3);">
        <i class="fa-solid fa-circle-check"></i> <span>{{ mensagem }}</span>
      </div>
      {% endif %}
      {% if erro %}
      <div class="alerta">
        <i class="fa-solid fa-circle-exclamation"></i> <span>{{ erro }}</span>
      </div>
      {% endif %}

      <form method="POST">
        <div class="campo">
          <label for="senha_atual">Senha atual</label>
          <input type="password" id="senha_atual" name="senha_atual" required>
        </div>
        <div class="campo">
          <label for="nova_senha">Nova senha</label>
          <input type="password" id="nova_senha" name="nova_senha" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="campo">
          <label for="confirmar_senha">Confirmar nova senha</label>
          <input type="password" id="confirmar_senha" name="confirmar_senha" required>
        </div>
        <button type="submit" class="btn btn-primario">Alterar Senha</button>
      </form>
    </div>
  </div>
</body>
</html>
